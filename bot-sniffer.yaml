apiVersion: v1
kind: Pod
metadata:
  name: bot-sniffer
  namespace: botnet
spec:
  hostNetwork: true # КРИТИЧЕСКАЯ УЯЗВИМОСТЬ: Подключает под напрямую к сети узла
  containers:
  - name: sniffer
    image: alpine
    command: ["/bin/sh", "-c", "apk add --no-cache tcpdump curl && sleep 3600"]
    securityContext:
      privileged: true # Дает права на прослушивание системных интерфейсов
